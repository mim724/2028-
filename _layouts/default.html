<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="keywords" content="{{ page.keywords | join: ', ' | default: site.keywords }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "{{ page.title | default: site.title }}",
      "description": "{{ page.description | default: site.description }}",
      "datePublished": "{{ page.date | default: site.time }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | default: site.time }}"
    }
    </script>
    <!-- Baidu auto-push -->
<script>
(function(){
    var bp = document.createElement('script');
    var curProtocol = window.location.protocol.split(':')[0];
    if (curProtocol === 'https') {
        bp.src = 'https://zz.bdstatic.com/linksubmit/push.js';
    } else {
        bp.src = 'http://push.zhanzhang.baidu.com/push.js';
    }
    var s = document.getElementsByTagName("script")[0];
    s.parentNode.insertBefore(bp, s);
})();
</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;color:#333;background:#f9f9f9}
        .container{max-width:800px;margin:20px auto;padding:40px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        h1{font-size:1.8em;margin-bottom:.5em;color:#1a1a1a;border-bottom:2px solid #e0e0e0;padding-bottom:.3em}
        h2{font-size:1.4em;margin:1.2em 0 .5em;color:#222}
        h3{font-size:1.15em;margin:1em 0 .4em;color:#333}
        p{margin:.6em 0;text-align:justify}
        ul,ol{margin:.6em 0 .6em 2em}
        li{margin:.3em 0}
        blockquote{border-left:4px solid #4a90d9;padding-left:1em;margin:1em 0;color:#666;background:#f5f5f5;padding:.8em 1em;border-radius:0 4px 4px 0}
        code{background:#f0f0f0;padding:.15em .35em;border-radius:3px;font-size:.9em}
        pre{background:#f5f5f5;padding:1em;border-radius:4px;overflow-x:auto;margin:1em 0}
        pre code{background:none;padding:0}
        img{max-width:100%;height:auto;border-radius:4px}
        a{color:#4a90d9;text-decoration:none}
        a:hover{text-decoration:underline}
        .meta{color:#999;font-size:.85em;margin-bottom:1em}
        article{margin-top:1em}
        footer{margin-top:2em;padding-top:1em;border-top:1px solid #eee;color:#999;font-size:.85em;text-align:center}
        .nav{margin-top:1.5em;padding-top:1em;border-top:1px solid #eee;display:flex;justify-content:space-between}
        @media(max-width:600px){.container{padding:20px;margin:10px}h1{font-size:1.5em}}
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <div class="meta">{{ page.description }}</div>
        {% endif %}
        <article>{{ content }}</article>
        <footer>
            <p>{{ site.title }}</p>
        </footer>
    </div>
</body>
</html>
